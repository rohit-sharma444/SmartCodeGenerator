<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 900" width="1760" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Component and dependency overview</title><desc id="d">The solution's projects as groups of components, with the main calls between them and the external stores they read and write.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1760" height="900" fill="#ffffff"/>
<rect x="225.0" y="15.0" width="90.0" height="30.0" rx="15.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="270.0" y="34.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >User</text>
<rect x="70.0" y="80.0" width="400.0" height="154.0" rx="10" fill="#dbeafe" stroke="#1f6feb" stroke-width="1.5"/>
<text x="84.0" y="102.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#1f6feb" >CodeGenerator (executable)</text>
<text x="84.0" y="128.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >CodeGeneratorStarter: interactive loop, RunOnce, status</text>
<text x="84.0" y="145.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >CommandLineEditor: history, TAB suggestions</text>
<text x="84.0" y="162.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >BuildAppCommand: build app, review loop, approve</text>
<text x="84.0" y="179.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >Web (Blazor Server on LoopbackHost): workflow page,</text>
<text x="84.0" y="196.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >   chat page, relationships page, validation page</text>
<text x="84.0" y="213.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >Scripts: save session / run (ScriptBuildApp)</text>
<rect x="70.0" y="340.0" width="400.0" height="86.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="84.0" y="362.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >NaturalLanguageBridge</text>
<text x="84.0" y="388.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >NaturalLanguagePipeline: the entry for every command</text>
<text x="84.0" y="405.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >NlpActionProvider: the primary action verb</text>
<rect x="70.0" y="470.0" width="400.0" height="137.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="84.0" y="492.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >CodeGenerationEngine</text>
<text x="84.0" y="518.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >CommandHandlingService: parse, intent, dispatch</text>
<text x="84.0" y="535.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >Roslyn generators: classes, projects, validators</text>
<text x="84.0" y="552.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >ValidationRegistry + validation-rules.json</text>
<text x="84.0" y="569.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >LearnedIntentStore, PhraseCandidates (learning)</text>
<text x="84.0" y="586.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >UndoJournal, WorkspaceSnapshot (undo / redo / batch)</text>
<rect x="70.0" y="690.0" width="400.0" height="154.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="84.0" y="712.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >CodeIntelligence (AI layer, on by default)</text>
<text x="84.0" y="738.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >AiLayer: starts the model, builds its own index</text>
<text x="84.0" y="755.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >RetrievalIntentResolver: nearest known phrasings</text>
<text x="84.0" y="772.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >OnnxEmbeddingProvider (CodeIntelligence.Onnx)</text>
<text x="84.0" y="789.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >SqliteVectorStore: ai-index.db + decision log</text>
<text x="84.0" y="806.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >Reached via CodeIntelligence.Abstractions; it only</text>
<text x="84.0" y="823.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >suggests, and a command runs after you confirm</text>
<rect x="540.0" y="80.0" width="420.0" height="188.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="554.0" y="102.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >DomainDiscovery</text>
<text x="554.0" y="128.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >DomainModelSourceFactory: chooses, falls back</text>
<text x="554.0" y="145.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >OllamaDomainModelSource: local LLM</text>
<text x="554.0" y="162.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >WikipediaDomainModelSource: store, then online API</text>
<text x="554.0" y="179.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >BundledDomainSource: 25 built-in domains</text>
<text x="554.0" y="196.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >DomainDiscoveryPipeline: SeedEntityExtractor</text>
<text x="554.0" y="213.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >   (nouns + TransactionVerbs), WikipediaTopicRecognizer,</text>
<text x="554.0" y="230.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >   DomainEnricher / EntityHarvester</text>
<text x="554.0" y="247.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >ModelEditor: the review edits</text>
<rect x="540.0" y="340.0" width="300.0" height="86.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="554.0" y="362.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >NaturalLanguageEngine</text>
<text x="554.0" y="388.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >EngineBuilder: 7-stage pipeline</text>
<text x="554.0" y="405.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >(orders 5, 10, 20, 30, 40, 45, 50)</text>
<rect x="1070.0" y="80.0" width="400.0" height="137.0" rx="10" fill="#ede9fe" stroke="#8957e5" stroke-width="1.5"/>
<text x="1084.0" y="102.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#8957e5" >DataIngestion</text>
<text x="1084.0" y="128.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >InlineDataSource / DataSourceInterview</text>
<text x="1084.0" y="145.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >IDataSourceReader: Csv, DelimitedText, JsonTable,</text>
<text x="1084.0" y="162.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >   Excel, SqlServer</text>
<text x="1084.0" y="179.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >NormalizationAnalyzer + Plan + Prompt</text>
<text x="1084.0" y="196.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >DataModelBuilder / TabularImport</text>
<rect x="1070.0" y="290.0" width="400.0" height="154.0" rx="10" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="1084.0" y="312.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#238636" >AppScaffolding</text>
<text x="1084.0" y="338.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >DomainModelMapper</text>
<text x="1084.0" y="355.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >AppScaffolder + ITargetScaffolder targets: wpf, winforms,</text>
<text x="1084.0" y="372.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >   console, webapi, blazor, classlib, worker</text>
<text x="1084.0" y="389.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >JSON store or SQLite (EF Core) persistence</text>
<text x="1084.0" y="406.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >SeedFileWriter + ImportedData, GeneratedFilesManifest</text>
<text x="1084.0" y="423.0" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2937" >A &lt;App&gt;.Tests xUnit project beside every app</text>
<rect x="540.0" y="490.0" width="420.0" height="32.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750.0" y="510.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Ollama (local LLM, optional)</text>
<rect x="540.0" y="545.0" width="420.0" height="32.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750.0" y="565.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Wikipedia API (online, cached in .dd-cache)</text>
<rect x="540.0" y="600.0" width="420.0" height="32.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750.0" y="620.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Wikipedia store: %ProgramData%\SmartCodeGenerator\Wikipedia</text>
<rect x="540.0" y="700.0" width="420.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750.0" y="720.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Workspace files: generated code, .codegen,</text>
<text x="750.0" y="738.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >.dd-cache, history, the generated apps</text>
<rect x="1490.0" y="100.0" width="250.0" height="68.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="1615.0" y="120.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Your data: CSV / TXT /</text>
<text x="1615.0" y="138.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >JSON / Excel files,</text>
<text x="1615.0" y="156.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >or a SQL Server database</text>
