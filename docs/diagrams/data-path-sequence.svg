<text x="617.5" y="496.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#111827" >CandidateDomainModel + ImportedData</text>
<rect x="8.0" y="516.0" width="508.8" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="262.4" y="532.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#78350f" >Review loop (workflow page or typed). One decision record per applied split,</text>
<text x="262.4" y="550.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#78350f" >so `why OrderItem` can explain it. NoData goes to the discovery path.</text>
