<path d="M35.0,620.0 L20.0,620.0" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="885.0" y="325.0" width="330.0" height="70.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="1050.0" y="346.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Interactive?</text>
<text x="1050.0" y="364.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Yes: the workflow page opens (ten stages)</text>
<text x="1050.0" y="382.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >No: the typed review loop</text>
<path d="M875.0,280.0 L1050.0,280.0 L1050.0,325.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="915.4" y="271.0" width="29.2" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="930.0" y="284.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >yes</text>
<rect x="885.0" y="434.0" width="330.0" height="52.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="1050.0" y="455.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Has data? inline `from &lt;format&gt; &lt;location&gt;`,</text>
<text x="1050.0" y="473.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >or the Data stage / the y answer</text>
<path d="M1050.0,395.0 L1050.0,434.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="635.0" y="535.0" width="330.0" height="70.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="800.0" y="556.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Discovery path</text>
<text x="800.0" y="574.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >DomainModelSourceFactory: Ollama, then the store or</text>
<text x="800.0" y="592.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >built-in domains, then online Wikipedia</text>
<rect x="1145.0" y="535.0" width="290.0" height="70.0" rx="8" fill="#ede9fe" stroke="#8957e5" stroke-width="1.5"/>
<text x="1290.0" y="556.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Data path: DataIngestion reads</text>
<text x="1290.0" y="574.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >CSV / TXT / JSON / Excel / SQL Server</text>
<text x="1290.0" y="592.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >into tables (no Wikipedia call)</text>
<rect x="1145.0" y="644.0" width="290.0" height="52.0" rx="8" fill="#ede9fe" stroke="#8957e5" stroke-width="1.5"/>
<text x="1290.0" y="665.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >NormalizationAnalyzer: findings</text>
<text x="1290.0" y="683.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >n / n &lt;ids&gt; / k / d &lt;n&gt;</text>
<rect x="1145.0" y="724.0" width="290.0" height="52.0" rx="8" fill="#ede9fe" stroke="#8957e5" stroke-width="1.5"/>
<text x="1290.0" y="745.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >DataModelBuilder + TabularImport</text>
<text x="1290.0" y="763.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >CandidateDomainModel + ImportedData</text>
<path d="M1050.0,486.0 L800.0,520.0 L800.0,535.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="788.6" y="511.0" width="22.8" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="800.0" y="524.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >no</text>
<path d="M1050.0,486.0 L1290.0,520.0 L1290.0,535.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1275.4" y="511.0" width="29.2" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="1290.0" y="524.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >yes</text>
<path d="M1290.0,605.0 L1290.0,644.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M1290.0,696.0 L1290.0,724.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="850.0" y="824.0" width="400.0" height="52.0" rx="8" fill="#dbeafe" stroke="#1f6feb" stroke-width="1.5"/>
<text x="1050.0" y="845.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Review: print the model; add / remove / rename / field /</text>
<text x="1050.0" y="863.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >why / rules / accept / approve / cancel</text>
<path d="M800.0,605.0 L800.0,850.0 L850.0,850.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M1290.0,775.0 L1290.0,800.0 L1150.0,800.0 L1150.0,824.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="775.0" y="933.0" width="210.0" height="34.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="880.0" y="954.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >approve &lt;target&gt; [sqlite]</text>
<rect x="1005.0" y="924.0" width="250.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="1130.0" y="945.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >AppScaffolder writes the app,</text>
<text x="1130.0" y="963.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >its .Tests project and Data/Seed</text>
<rect x="1300.0" y="924.0" width="240.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="1420.0" y="945.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >dotnet build; offer to run it</text>
<text x="1420.0" y="963.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >(interactive only)</text>
<rect x="1320.0" y="815.0" width="200.0" height="70.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1420.0" y="836.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >cancel or end of input:</text>
<text x="1420.0" y="854.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >nothing is generated;</text>
<text x="1420.0" y="872.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >back to the prompt</text>
<path d="M1000.0,876.0 L1000.0,905.0 L880.0,905.0 L880.0,929.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M985.0,950.0 L1005.0,950.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
