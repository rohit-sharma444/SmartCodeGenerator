<rect x="188.6" y="521.0" width="22.8" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="200.0" y="534.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >no</text>
<path d="M400.0,547.0 L400.0,594.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="385.4" y="561.5" width="29.2" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="400.0" y="574.5" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >yes</text>
<path d="M400.0,646.0 L400.0,693.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M400.0,732.0 L400.0,750.0 L110.0,750.0 L110.0,755.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
