<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1060" width="1560" height="1060" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">End-to-end flow</title><desc id="d">One trip through the CLI: read a command, branch on build app, then either analyze-and-generate code, discover a domain model, or read the model from your data, review it, scaffold the app, build it and return to the prompt.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1560" height="1060" fill="#ffffff"/>
<text x="780.0" y="26.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937" >One trip through CodeGenerator: the prompt, the command path (left) and the build app paths (right)</text>
<rect x="685.0" y="53.0" width="190.0" height="34.0" rx="17.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="780.0" y="74.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Start: CodeGenerator</text>
<rect x="655.0" y="113.0" width="250.0" height="34.0" rx="8" fill="#dbeafe" stroke="#1f6feb" stroke-width="1.5"/>
<text x="780.0" y="134.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Read a command at the prompt</text>
<rect x="705.0" y="183.0" width="150.0" height="34.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="780.0" y="204.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >input = exit?</text>
<rect x="915.0" y="183.0" width="190.0" height="34.0" rx="17.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="1010.0" y="204.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Save history and quit</text>
<rect x="685.0" y="263.0" width="190.0" height="34.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="780.0" y="284.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >a build app line?</text>
<path d="M780.0,87.0 L780.0,113.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M780.0,147.0 L780.0,183.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M855.0,200.0 L915.0,200.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="870.4" y="191.0" width="29.2" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="885.0" y="204.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >yes</text>
<path d="M780.0,217.0 L780.0,263.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="768.6" y="231.0" width="22.8" height="16" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="780.0" y="244.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >no</text>
<rect x="270.0" y="363.0" width="260.0" height="34.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="400.0" y="384.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >NaturalLanguagePipeline.Handle</text>
<rect x="270.0" y="424.0" width="260.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="400.0" y="445.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >NaturalLanguageEngine.Analyze</text>
<text x="400.0" y="463.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >primary action verb</text>
<rect x="275.0" y="513.0" width="250.0" height="34.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="400.0" y="534.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Rules recognize the line?</text>
<rect x="35.0" y="585.0" width="190.0" height="70.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="130.0" y="606.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >AI layer: embed the line,</text>
<text x="130.0" y="624.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >suggest the nearest command;</text>
<text x="130.0" y="642.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >runs only after you confirm</text>
<rect x="265.0" y="594.0" width="270.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="400.0" y="615.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >CommandHandlingService</text>
<text x="400.0" y="633.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >parse, detect intent, extract entities</text>
<rect x="350.0" y="693.0" width="100.0" height="34.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="400.0" y="714.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >intent?</text>
<rect x="35.0" y="755.0" width="150.0" height="70.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="110.0" y="776.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >create class /</text>
<text x="110.0" y="794.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >interface: Roslyn</text>
<text x="110.0" y="812.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >generate + compile</text>
<rect x="200.0" y="764.0" width="150.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="275.0" y="785.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >create project:</text>
<text x="275.0" y="803.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >scaffold .csproj</text>
<rect x="355.0" y="764.0" width="170.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="440.0" y="785.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >add / show validation:</text>
<text x="440.0" y="803.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >ValidationRegistry</text>
<rect x="530.0" y="764.0" width="170.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="615.0" y="785.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >analyze, list, rename,</text>
<text x="615.0" y="803.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >delete, undo ...</text>
<rect x="275.0" y="864.0" width="250.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="400.0" y="885.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Save to the workspace</text>
<text x="400.0" y="903.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >(the undo journal keeps a copy)</text>
<rect x="275.0" y="939.0" width="250.0" height="52.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="400.0" y="960.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Record the outcome</text>
<text x="400.0" y="978.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >(learning, phrase candidates)</text>
<path d="M685.0,280.0 L400.0,280.0 L400.0,363.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
