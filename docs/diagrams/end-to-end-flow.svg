<path d="M1250.0,850.0 L1320.0,850.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1045.0" y="1003.0" width="170.0" height="34.0" rx="17.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="1130.0" y="1024.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Back to the prompt</text>
<path d="M1420.0,976.0 L1420.0,1020.0 L1215.0,1020.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
