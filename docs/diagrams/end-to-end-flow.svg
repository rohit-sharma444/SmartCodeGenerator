<text x="600.0" y="284.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" >no</text>
<path d="M400.0,397.0 L400.0,424.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M400.0,476.0 L400.0,513.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
