<rect x="366.0" y="502.0" width="408.0" height="44.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<text x="570.0" y="518.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#78350f" >A line no rule recognizes goes to the AI layer instead:</text>
<text x="570.0" y="536.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#78350f" >it may suggest a command, which runs only after you confirm.</text>
