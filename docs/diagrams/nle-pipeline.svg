<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 330" width="1370" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">NaturalLanguageEngine pipeline</title><desc id="d">Seven ordered stages: Normalization (5), Tokenization (10), Morphology (20), POS tagging (30), Phrase detection (40), Dependency parsing (45), Semantic analysis (50).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1370" height="330" fill="#ffffff"/>
<text x="685.0" y="28.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937" >NaturalLanguageEngine: seven ordered stages over one AnalysisContext</text>
<rect x="20.0" y="134.0" width="100.0" height="52.0" rx="26.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="70.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >English</text>
<text x="70.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >text</text>
<rect x="144.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="215.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >1. Normalization</text>
<text x="215.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 5</text>
<text x="215.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >case, spacing,</text>
<text x="215.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >contractions</text>
<path d="M120.0,160.0 L144.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="296.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="367.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >2. Tokenization</text>
<text x="367.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 10</text>
<text x="367.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >words, symbols,</text>
<text x="367.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >quoted strings</text>
<path d="M286.0,160.0 L296.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="448.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="519.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >3. Morphology</text>
<text x="519.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 20</text>
<text x="519.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >lemmas, plurals,</text>
<text x="519.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >verb forms</text>
<path d="M438.0,160.0 L448.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="600.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="671.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >4. POS tagging</text>
<text x="671.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 30</text>
<text x="671.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >noun / verb /</text>
<text x="671.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >adjective ...</text>
<path d="M590.0,160.0 L600.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="752.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="823.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >5. Phrase detection</text>
<text x="823.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 40</text>
<text x="823.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >noun and verb</text>
<text x="823.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >phrases</text>
<path d="M742.0,160.0 L752.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="904.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="975.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >6. Dependency parsing</text>
<text x="975.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 45</text>
<text x="975.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >who does what</text>
<text x="975.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >to whom</text>
<path d="M894.0,160.0 L904.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1056.0" y="108.0" width="142.0" height="104.0" rx="8" fill="#dcfce7" stroke="#238636" stroke-width="1.5"/>
<text x="1127.0" y="137.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >7. Semantic analysis</text>
<text x="1127.0" y="155.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >Order 50</text>
<text x="1127.0" y="173.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >entities, relations,</text>
<text x="1127.0" y="191.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >intent</text>
<path d="M1046.0,160.0 L1056.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1230.0" y="104.0" width="120.0" height="112.0" rx="8" fill="#dbeafe" stroke="#1f6feb" stroke-width="1.5"/>
<text x="1290.0" y="128.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >SemanticResult:</text>
<text x="1290.0" y="146.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >entities,</text>
<text x="1290.0" y="164.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >relationships,</text>
<text x="1290.0" y="182.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >intent,</text>
<text x="1290.0" y="200.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937" >diagnostics</text>
<path d="M1198.0,160.0 L1230.0,160.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="685.0" y="270.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569" >EngineBuilder assembles the stages and runs them in Order. The Tokenization stage lives under Lexical/Stages;</text>
<text x="685.0" y="290.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569" >the others live under Core/Stages. DomainDiscovery and NaturalLanguageBridge both call the engine.</text>
</svg>
