name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # lfs: true is load-bearing. The MiniLM weights
      # (CodeIntelligence.Onnx/Models/**/model.onnx) are stored in Git LFS, and
      # actions/checkout writes a 133-byte POINTER FILE unless told to fetch them.
      # The pointer has the right name and path, so File.Exists passes and the
      # failure surfaces much later as
      # "[ErrorCode:InvalidProtobuf] Protobuf parsing failed" from ONNX Runtime.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The main solution references every project (libraries, the CLI, the
      # importer, and all three test projects) via relative paths, so restoring
      # and testing it covers the whole repo. windows-latest is required: the
      # scaffolder emits WPF app code and GeneratedProjectBuildTests compiles
      # generated projects, some of which target Windows.
      - name: Restore
        run: dotnet restore SmartCodeGenerator/SmartCodeGenerator.slnx

      # -warnaserror enforces a clean build in CI only. It is deliberately not set
      # in Directory.Build.props so local iteration is never blocked by a warning.
      - name: Build
        run: dotnet build SmartCodeGenerator/SmartCodeGenerator.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SmartCodeGenerator/SmartCodeGenerator.slnx -c Release --no-build
